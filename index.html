<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seismo-stats-app</title>
  </head>
  <body>
      <section>
      <h2>Top 5 terremotos más intensos</h2>
      <table id="top-5-earthquakes"></table>
    </section>

      <input type="text" id="cityInput" placeholder="Introduce una ciudad">
      <select id="maxRadius" name="max-radius" required>
        <option value="25">25km</option>
        <option value="50">50km</option>
        <option value="100">100km</option>
      </select>
      <button id="searchBtn">Buscar</button>

    <section>
      <h2>Terremotos totales</h2>
      <p id="total-earthquakes"></p>
    </section>

    <section>
      <h2>Magnitud media</h2>
      <p id="mean-magnitude"></p>
    </section>

    <section>
      <h2>Máxima magnitud</h2>
      <p id="event-max-magnitude"></p>
    </section>

    <section>
      <h2>Frecuencia por año</h2>
      <canvas id="frequency-by-year"></canvas>
    </section>

    <section>
      <h2>Tiempo medio entre terremotos</h2>
      <p id="average-time-between"></p>
    </section>

    <section>
      <h2>Distribución por profundidad</h2>
      <p id="max-event-depth-distribution"></p>
      <canvas id="depth-distribution"></canvas>
    </section>

    <section>
      <h2>Tabla de probabilidades</h2>
      <table id="probability-table"></table>
    </section>

    <section>
      <h2>Últimos 5 terremotos</h2>
      <table id="last-earthquakes"></table>
    </section>

    <div id="loading" class="hidden">
      <i class="bi bi-arrow-repeat spinner"></i>
      <span>Cargando...</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
